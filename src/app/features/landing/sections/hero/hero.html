<section id="home" class="hero">
  <div class="hero__content">
    <span class="hero__badge">Smarter Finance for a Brighter Tomorrow</span>

    <h1 class="hero__title">
      Your Money,<br><span class="hero__title-accent">One Simple Flow.</span>
    </h1>

    <p class="hero__text">
      Simple payments. Smarter finances. One seamless experience.
    </p>

    <div class="hero__actions">
      <button class="hero__btn hero__btn--primary" (click)="onContactClick()">
        Get in Touch
      </button>
      <button class="hero__btn hero__btn--secondary" (click)="scrollToServices()">
        Explore FlowPay
      </button>
    </div>
  </div>

  <div class="hero__visual">
    <img src="assets/images/hero-app-mockup.png" alt="FlowPay mobile app showing balance and recent transactions" class="hero__image">
  </div>
</section>
