<section id="faq" class="faq" appScrollReveal>
  <div class="faq__intro">
    <h2 class="faq__title">Frequently Asked Questions</h2>
    <p class="faq__text">Everything you need to know about getting started with FlowPay.</p>
  </div>

  <div class="faq__list">
    @for (item of faqs; track item.id) {
      <app-faq-item [faq]="item"></app-faq-item>
    }
  </div>
</section>
