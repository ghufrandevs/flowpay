<header class="header">
  <img src="assets/images/flowpay-logo.png" alt="FlowPay" class="header__logo-img">

  <nav class="header__nav" [class.header__nav--open]="isMenuOpen()">
    <a href="#home" (click)="scrollTo('home', $event)">Home</a>
    <a href="#about" (click)="scrollTo('about', $event)">About</a>
    <a href="#services" (click)="scrollTo('services', $event)">Services</a>
    <a href="#how-it-works" (click)="scrollTo('how-it-works', $event)">How It Works</a>
    <a href="#faq" (click)="scrollTo('faq', $event)">FAQ</a>
    <button type="button" class="contact-link" (click)="onContactClick()">Contact</button>
  </nav>

  <button class="header__menu-btn" (click)="toggleMenu()" [attr.aria-label]="isMenuOpen() ? 'Close menu' : 'Open menu'">
    @if (isMenuOpen()) {
      <span>✕</span>
    } @else {
      <span>☰</span>
    }
  </button>
</header>
